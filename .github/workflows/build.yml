name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Prepare release
        id: v
        run: |
          VC=$(grep versionCode app/build.gradle | awk '{print $2}')
          VN=$(grep versionName app/build.gradle | awk -F"'" '{print $2}')
          echo "vc=$VC" >> $GITHUB_OUTPUT
          echo "vn=$VN" >> $GITHUB_OUTPUT
          cp app/build/outputs/apk/debug/*.apk Shadow.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PrivacyShield-debug
          path: Shadow.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.vc }}
          name: Shadow ${{ steps.v.outputs.vn }}
          files: Shadow.apk
          make_latest: true
